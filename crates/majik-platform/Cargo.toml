[package]
name = "majik-platform"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Platform-native clipboard and desktop integration for Majik"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem"] }

[target.'cfg(target_os = "windows")'.dependencies]
# CF_HDROP is a packed DROPFILES struct with a double-null-terminated wide path list; this crate
# has a tested setter for it, which is worth more than hand-packing it blind from a Mac.
clipboard-win = "5"
# `RtlGetVersion` for `system::os_version`; the Wdk feature carries it.
windows = { version = "0.61", features = ["Wdk_System_SystemServices", "Win32_System_SystemInformation"] }
