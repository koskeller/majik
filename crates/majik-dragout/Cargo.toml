[package]
name = "majik-dragout"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Native drag-out of library files from Majik to other applications"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL", "NSGeometry", "NSData"] }
objc2-app-kit = { version = "0.3", features = ["NSView", "NSResponder", "NSApplication", "NSEvent", "NSPasteboard", "NSPasteboardItem", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSImage", "NSWorkspace", "NSGraphics"] }
block2 = "0.6"
