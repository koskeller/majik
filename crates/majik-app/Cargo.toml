[package]
name = "majik-app"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "The Majik desktop application: GPUI windows, views and app state"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "majik"
path = "src/main.rs"

[dependencies]
majik-core = { path = "../majik-core" }
majik-video = { path = "../majik-video" }
majik-providers = { path = "../majik-providers" }
majik-generation = { path = "../majik-generation" }
majik-platform = { path = "../majik-platform" }
majik-audio = { path = "../majik-audio" }
majik-crashes = { path = "../majik-crashes" }
majik-telemetry.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "multipart"] }
directories.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
image.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-base.workspace = true
# `gpui::ImageCacheItem::Loading` holds a `futures::future::Shared<Task<…>>`, so our image cache
# needs `FutureExt::shared` to build one (gpui pulls the same crate in).
futures.workspace = true
sha2.workspace = true
# `gpui::RenderImage::new` takes a `SmallVec` of frames; the image cache builds one.
smallvec = "1"
rust-embed = "8"
chrono = "0.4"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3"
# `tests/crash.rs` checks the minidump the crash server wrote is what it says it is.
zstd = "0.13"
