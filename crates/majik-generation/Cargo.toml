[package]
name = "majik-generation"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Majik's generation engine: requests in, generation events out"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
majik-core = { path = "../majik-core" }
majik-providers = { path = "../majik-providers" }
# The seeding tool writes library files the same way the library does: through the blob store.
majik-storage = { path = "../majik-storage" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = "0.7"
async-channel = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
